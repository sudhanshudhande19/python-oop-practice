<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Day 26 — Hierarchical and Hybrid Inheritance</title>
  <desc id="desc">A dimensional 3D inheritance diagram with a parent node branching to child nodes and a hybrid diamond structure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07152f"/><stop offset=".55" stop-color="#142b52"/><stop offset="1" stop-color="#32145b"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9bf7ff"/><stop offset=".5" stop-color="#28c8e8"/><stop offset="1" stop-color="#0876b8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2c4ff"/><stop offset=".5" stop-color="#a66cff"/><stop offset="1" stop-color="#6631c8"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a8"/><stop offset=".55" stop-color="#ffbd4a"/><stop offset="1" stop-color="#d66b19"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="18"/><feComponentTransfer><feFuncA type="linear" slope=".48"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8cbcff" stroke-opacity=".10" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="560" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="34" fill="url(#grid)"/>
  <circle cx="1350" cy="95" r="210" fill="#8a5cff" opacity=".10"/>
  <circle cx="250" cy="500" r="250" fill="#16c8e8" opacity=".08"/>
  <g opacity=".22" stroke="#9bbcff" stroke-width="2" fill="none"><path d="M0 430L520 560M1080 0L1600 160M0 110L420 0M1200 560L1600 430"/></g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="92" y="110" fill="#9beeff" font-size="25" font-weight="700" letter-spacing="8">PYTHON OOP • LEARNING JOURNEY</text>
    <text x="88" y="218" fill="#ffffff" font-size="86" font-weight="900">DAY 26</text>
    <text x="94" y="286" fill="#e5eaff" font-size="43" font-weight="800">HIERARCHICAL &amp;</text>
    <text x="94" y="342" fill="#c6a6ff" font-size="43" font-weight="800">HYBRID INHERITANCE</text>
    <text x="96" y="410" fill="#b9c9e8" font-size="22">One parent • Many children • Combined class structures</text>
    <g transform="translate(1010 72)" filter="url(#shadow)">
      <!-- connecting beams -->
      <g stroke="#9cecff" stroke-width="8" stroke-linecap="round" fill="none" opacity=".9">
        <path d="M260 115L260 180L90 260M260 180L260 260M260 180L430 260"/>
        <path d="M90 335L260 405L430 335" stroke="#c9a7ff" stroke-width="7"/>
      </g>
      <!-- parent 3D block -->
      <g transform="translate(175 20)">
        <path d="M0 28L86 0L172 28L86 58Z" fill="#baf7ff"/>
        <path d="M0 28L86 58V126L0 96Z" fill="#159ac6"/>
        <path d="M86 58L172 28V96L86 126Z" fill="#08739f"/>
        <text x="86" y="86" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">PARENT</text>
      </g>
      <!-- child blocks -->
      <g transform="translate(8 245)">
        <path d="M0 24L76 0L152 24L76 50Z" fill="#d8c2ff"/><path d="M0 24L76 50V112L0 86Z" fill="#8650d8"/><path d="M76 50L152 24V86L76 112Z" fill="#5b32aa"/>
        <text x="76" y="78" text-anchor="middle" fill="white" font-size="17" font-weight="700">CHILD A</text>
      </g>
      <g transform="translate(184 245)">
        <path d="M0 24L76 0L152 24L76 50Z" fill="#b8f5ff"/><path d="M0 24L76 50V112L0 86Z" fill="#159ac6"/><path d="M76 50L152 24V86L76 112Z" fill="#08739f"/>
        <text x="76" y="78" text-anchor="middle" fill="white" font-size="17" font-weight="700">CHILD B</text>
      </g>
      <g transform="translate(360 245)">
        <path d="M0 24L76 0L152 24L76 50Z" fill="#ffe6a0"/><path d="M0 24L76 50V112L0 86Z" fill="#e99a2c"/><path d="M76 50L152 24V86L76 112Z" fill="#b96b18"/>
        <text x="76" y="78" text-anchor="middle" fill="white" font-size="17" font-weight="700">CHILD C</text>
      </g>
      <g transform="translate(180 400)">
        <path d="M0 20L80 0L160 20L80 45Z" fill="#ffe6a0"/><path d="M0 20L80 45V100L0 75Z" fill="#d88a24"/><path d="M80 45L160 20V75L80 100Z" fill="#a85c12"/>
        <text x="80" y="72" text-anchor="middle" fill="white" font-size="16" font-weight="700">HYBRID</text>
      </g>
    </g>
    <text x="1510" y="510" text-anchor="end" fill="#8ea8d4" font-size="16" letter-spacing="3">LEARN • BUILD • PRACTISE</text>
  </g>
</svg>