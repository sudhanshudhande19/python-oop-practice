<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Made by Sudhanshu Dhande" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3a4a"/>
      <stop offset="0.5" stop-color="#1b263b"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="220" rx="24"/></clipPath>
    <text id="name" x="600" y="125" text-anchor="middle" font-family="Impact, 'Arial Black', Verdana, sans-serif" font-size="64" font-weight="900" letter-spacing="3">SUDHANSHU DHANDE</text>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="220" fill="url(#bg)"/>

    <g stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.2">
      <line x1="0" y1="168" x2="1200" y2="168"/>
      <line x1="0" y1="182" x2="1200" y2="182"/>
      <line x1="0" y1="200" x2="1200" y2="200"/>
      <line x1="600" y1="158" x2="-300" y2="220"/>
      <line x1="600" y1="158" x2="0" y2="220"/>
      <line x1="600" y1="158" x2="300" y2="220"/>
      <line x1="600" y1="158" x2="600" y2="220"/>
      <line x1="600" y1="158" x2="900" y2="220"/>
      <line x1="600" y1="158" x2="1200" y2="220"/>
      <line x1="600" y1="158" x2="1500" y2="220"/>
    </g>

    <text x="600" y="48" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="20" letter-spacing="6" fill="#22d3ee">&#10024; MADE BY &#10024;</text>

    <g filter="url(#shadow)">
      <g fill="#053b4d">
        <use xlink:href="#name" x="9" y="9"/><use xlink:href="#name" x="8" y="8"/>
        <use xlink:href="#name" x="7" y="7"/><use xlink:href="#name" x="6" y="6"/>
      </g>
      <g fill="#0e7490">
        <use xlink:href="#name" x="5" y="5"/><use xlink:href="#name" x="4" y="4"/>
        <use xlink:href="#name" x="3" y="3"/><use xlink:href="#name" x="2" y="2"/>
        <use xlink:href="#name" x="1" y="1"/>
      </g>
      <use xlink:href="#name" fill="url(#face)"/>
    </g>

    <text x="600" y="152" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#a5f3fc" fill-opacity="0.85">PYTHON OOP MASTERY  |  DAY 18</text>

    <rect x="3" y="3" width="1194" height="214" rx="22" fill="none" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2"/>
  </g>
</svg>
