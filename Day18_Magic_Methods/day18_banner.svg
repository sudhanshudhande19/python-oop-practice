<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Day 18 - Magic Methods in Python OOP" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="0.6" stop-color="#1b263b"/>
      <stop offset="1" stop-color="#0b3a4a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#155e75"/>
      <stop offset="1" stop-color="#0b2f3f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="24"/></clipPath>
    <text id="title" x="80" y="170" font-family="Impact, 'Arial Black', Verdana, sans-serif" font-size="112" font-weight="900" letter-spacing="4">DAY 18</text>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- 3D perspective floor grid -->
    <g stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.2">
      <line x1="0" y1="252" x2="1200" y2="252"/>
      <line x1="0" y1="266" x2="1200" y2="266"/>
      <line x1="0" y1="284" x2="1200" y2="284"/>
      <line x1="0" y1="308" x2="1200" y2="308"/>
      <line x1="600" y1="240" x2="-300" y2="320"/>
      <line x1="600" y1="240" x2="-50" y2="320"/>
      <line x1="600" y1="240" x2="200" y2="320"/>
      <line x1="600" y1="240" x2="400" y2="320"/>
      <line x1="600" y1="240" x2="600" y2="320"/>
      <line x1="600" y1="240" x2="800" y2="320"/>
      <line x1="600" y1="240" x2="1000" y2="320"/>
      <line x1="600" y1="240" x2="1250" y2="320"/>
      <line x1="600" y1="240" x2="1500" y2="320"/>
    </g>

    <!-- code chip -->
    <rect x="80" y="34" width="190" height="34" rx="10" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text x="175" y="57" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#67e8f9">__dunder__()</text>

    <!-- 3D extruded DAY 18 -->
    <g filter="url(#shadow)">
      <g fill="#053b4d">
        <use xlink:href="#title" x="14" y="14"/><use xlink:href="#title" x="13" y="13"/>
        <use xlink:href="#title" x="12" y="12"/><use xlink:href="#title" x="11" y="11"/>
        <use xlink:href="#title" x="10" y="10"/>
      </g>
      <g fill="#0a5c75">
        <use xlink:href="#title" x="9" y="9"/><use xlink:href="#title" x="8" y="8"/>
        <use xlink:href="#title" x="7" y="7"/><use xlink:href="#title" x="6" y="6"/>
        <use xlink:href="#title" x="5" y="5"/>
      </g>
      <g fill="#0e7490">
        <use xlink:href="#title" x="4" y="4"/><use xlink:href="#title" x="3" y="3"/>
        <use xlink:href="#title" x="2" y="2"/><use xlink:href="#title" x="1" y="1"/>
      </g>
      <use xlink:href="#title" fill="url(#face)"/>
    </g>

    <!-- subtitle -->
    <text x="84" y="226" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4" fill="#22d3ee" filter="url(#glow)">MAGIC METHODS IN PYTHON OOP</text>

    <!-- floating isometric cube -->
    <ellipse cx="960" cy="262" rx="85" ry="14" fill="#000000" fill-opacity="0.45"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="3s" repeatCount="indefinite"/>
      <polygon points="890,110 960,150 960,230 890,190" fill="url(#cubeLeft)"/>
      <polygon points="1030,110 960,150 960,230 1030,190" fill="url(#cubeRight)"/>
      <polygon points="960,70 1030,110 960,150 890,110" fill="url(#cubeTop)"/>
      <g stroke="#a5f3fc" stroke-opacity="0.6" stroke-width="1.5" fill="none">
        <polyline points="890,110 960,150 1030,110"/>
        <line x1="960" y1="150" x2="960" y2="230"/>
      </g>
      <text transform="translate(904,176) skewY(30)" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="700" fill="#ffffff">__</text>
      <text transform="translate(970,192) skewY(-30)" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#67e8f9">OOP</text>
    </g>

    <rect x="3" y="3" width="1194" height="314" rx="22" fill="none" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2"/>
  </g>
</svg>
